<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Мои фото{% endblock %}</title>
  <script src="{{ asset('theme.js') }}"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='none' stroke='%23f4f2ef' stroke-width='1.3'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/playfair-display-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-normal-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('fonts/fonts.css') }}">
  <link rel="stylesheet" href="{{ asset('style.css') }}">
</head>
<body class="{% block body_class %}page{% endblock %}">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="brand wordmark">Мои<em>фото</em></span>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-small" type="button" id="theme-toggle" title="Цветовая тема: «авто» следует настройке устройства">Тема: авто</button>
        {% block nav %}{% endblock %}
      </div>
    </div>
  </header>
  <main class="wrap" id="main">
    {% block content %}{% endblock %}
  </main>
  {% block overlays %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
