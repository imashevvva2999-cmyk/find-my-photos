{% extends "base.html" %}
{% block title %}Вход для организатора · Мои фото{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">Организатор</p>
  <h1>Вход для организатора</h1>
  <p class="muted">Создавать мероприятия и загружать фотографии может только организатор.</p>
  {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="stack">
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn" type="submit">Войти</button>
  </form>
</section>
{% endblock %}
