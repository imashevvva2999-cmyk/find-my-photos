# Render Blueprint: the backend (web app + face-processing worker) and its PostgreSQL database.
# Secrets are NOT in this file: SECRET_KEY is generated by Render, ADMIN_PASSWORD_HASH is pasted
# once in the Render dashboard (sync: false). Photos live on the persistent disk at /var/data.
services:
  - name: findmyphotos-backend
    type: web
    runtime: python
    plan: 1c-2g              # 1 CPU, 2 GB RAM (web ~0.8 GB + worker ~0.7 GB with 1 thread)
    region: frankfurt
    buildCommand: ./scripts/render_build.sh
    preDeployCommand: python -m app.migrate
    startCommand: ./scripts/render_start.sh
    healthCheckPath: /healthz
    disk:
      name: photos
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: findmyphotos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: WORKER_THREADS
        value: "1"
      - key: DB_POOL_MAX
        value: "10"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: findmyphotos-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: findmyphotos
    user: findmyphotos
    ipAllowList: []            # reachable only from Render services, not from the internet
