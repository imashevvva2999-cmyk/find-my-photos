[pytest]
testpaths = tests
# The old live-server scripts and the load/E2E tools are run separately.
addopts = --ignore=tests/test_full_flow.py --ignore=tests/evaluate_40.py --ignore=tests/fetch_nasa_test_photos.py --ignore=tests/load
markers =
    e2e: browser tests (Playwright); run with: pytest -m e2e tests/e2e
filterwarnings =
    ignore::DeprecationWarning
